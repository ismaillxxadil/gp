[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "notline-security-twin"
version = "0.1.0"
description = "Passive discovery and cybersecurity digital twin platform"
requires-python = ">=3.12,<3.15"
dependencies = [
    "neo4j>=5.28,<7",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
