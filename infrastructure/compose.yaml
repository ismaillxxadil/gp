services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: notline-neo4j
    restart: unless-stopped

    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in infrastructure/.env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  neo4j_data:
  neo4j_logs:
