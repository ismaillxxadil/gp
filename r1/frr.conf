frr defaults traditional
hostname R1

!
interface eth1
 description USERS-LAN
 ip address 10.10.10.1/24
 no shutdown
!

interface eth2
 description SERVER-LAN
 ip address 10.10.20.1/24
 no shutdown
!
interface eth3
 description DATABASE-LAN
 ip address 10.10.30.1/24
 no shutdown
!
interface eth4
 description APPLICATION-LAN
 ip address 10.10.25.1/24
 no shutdown
!
interface eth5
 description MANAGEMENT-LAN
 ip address 10.10.35.1/24
 no shutdown
!
line vty
